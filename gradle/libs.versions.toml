[versions]
kotlin = "2.1.0"
kotlinx-serialization = "1.7.3"
clikt = "4.4.0"
detekt = "1.23.7"
kover = "0.9.1"
graalvm-native = "0.10.4"
junit = "5.11.4"
mockk = "1.13.13"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# --- Reserved for future command implementations (errors/refs/test/symbols) ---
# Eclipse LSP4J (LSP client) — dual-licensed EPL-2.0 OR EDL-1.0; distribution selects EDL-1.0.
# lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version = "0.23.1" }
# Gradle Tooling API (project introspection / test discovery) — Apache-2.0.
# gradle-tooling-api = { module = "org.gradle:gradle-tooling-api", version = "8.14.3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
